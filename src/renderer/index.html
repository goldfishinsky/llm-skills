<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>LLM Skills</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
           <!-- Logo or Brand could go here -->
        </div>
        <button id="newSkillBtn" class="btn-new-chat">
          <span class="icon">+</span> New Skill
        </button>

        <div class="recents-section">
          <div class="section-title">Recents</div>
          <div class="skills-list" id="skillsList">
            <!-- Skills will be populated here as "recent chats" or similar -->
          </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="avatar">J</div>
          <div class="user-info">
            <span class="username">User</span>
            <span class="plan">Free plan</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <button id="sidebarToggleBtn" class="icon-btn" title="Toggle Sidebar">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="spacer"></div>
        <div class="top-right-actions">
             <!-- Placeholder for other top bar actions -->
        </div>
      </div>

      <div id="welcomeScreen" class="welcome-screen">
        <div class="greeting-container">
            <div class="plan-badge">Free plan · <a href="#">Upgrade</a></div>
            <h1>Afternoon, User</h1>
        </div>
        
        <div class="chat-input-container">
            <div class="input-box">
                <textarea id="mainInput" placeholder="How can I help you today?" rows="1"></textarea>
                <div class="input-actions">
                    <div class="left-actions">
                        <button class="icon-btn" title="Add Attachment">+</button>
                    </div>
                    <div class="right-actions">
                         <span class="model-selector">Sonnet 3.5</span>
                         <button id="sendBtn" class="send-btn">↑</button>
                    </div>
                </div>
            </div>
        </div>
      </div>

      <!-- Skill Editor (Hidden by default, used for "Settings" or specific skill editing) -->
      <div id="skillEditor" class="skill-editor hidden">
        <div class="editor-header">
          <input type="text" id="skillName" placeholder="Skill Name" class="skill-name-input">
          <div class="editor-actions">
            <button id="saveSkillBtn" class="btn-icon" title="Save Skill">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
            </button>
            <button id="deleteSkillBtn" class="btn-icon danger" title="Delete Skill">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
            <button id="closeEditorBtn" class="btn-icon" title="Close Editor">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="editor-body">
          <div class="form-group">
            <label for="skillDescription">Description</label>
            <textarea id="skillDescription" placeholder="Describe what this skill does..." rows="2"></textarea>
          </div>

          <div class="form-group">
            <label for="skillPrompt">Prompt Template</label>
            <textarea id="skillPrompt" placeholder="Enter your prompt template. Use {paramName} for parameters..." rows="8"></textarea>
          </div>

          <div class="form-group">
            <label>Parameters</label>
            <div id="parametersList" class="parameters-list"></div>
            <button id="addParameterBtn" class="btn btn-secondary">+ Add Parameter</button>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="skillProvider">Provider</label>
              <select id="skillProvider"></select>
            </div>
            <div class="form-group">
              <label for="skillModel">Model</label>
              <select id="skillModel"></select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="skillTemperature">Temperature</label>
              <input type="number" id="skillTemperature" min="0" max="2" step="0.1" value="0.7">
            </div>
            <div class="form-group">
              <label for="skillMaxTokens">Max Tokens</label>
              <input type="number" id="skillMaxTokens" min="1" max="128000" value="2000">
            </div>
          </div>
        </div>
      </div>

      <div id="skillExecution" class="skill-execution hidden">
        <div class="execution-header">
          <h2 id="executionSkillName"></h2>
          <button id="closeExecutionBtn" class="btn btn-secondary">Close</button>
        </div>

        <div class="execution-body">
          <div class="execution-inputs" id="executionInputs"></div>
          <button id="executeBtn" class="btn btn-primary">Execute</button>

          <div id="executionResult" class="execution-result hidden">
            <h3>Result:</h3>
            <div id="resultContent" class="result-content"></div>
            <div id="resultUsage" class="result-usage"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="defaultProvider">Default Provider</label>
          <select id="defaultProvider"></select>
        </div>
        <div class="form-group">
          <label for="defaultModel">Default Model</label>
          <select id="defaultModel"></select>
        </div>
        <div class="form-group">
          <label for="theme">Theme</label>
          <select id="theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <h3>API Keys</h3>
        <div id="apiKeysList"></div>
      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
